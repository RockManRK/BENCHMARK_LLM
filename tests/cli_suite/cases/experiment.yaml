# Experiment command cases (area: experiment).
# Case ids follow the manual roteiro's CE- prefix (docs/tests/BCLLM_Roteiro_Manual_Testes.md)
# so a case imported from there keeps its original id.
cases:
  - id: CE-001
    name: criar experimento minimo
    area: experiment
    profiles: [smoke, cli-unit, full]
    priority: critical
    tags: [creation]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    command:
      argv: ["--create-experiment", "{ns}_ce001"]
    expect:
      exit_code: 0
      no_traceback: true
    db:
      assertions:
        - query: "SELECT COUNT(*) FROM experiments WHERE name = ?"
          params: ["{ns}_ce001"]
          equals: 1
        # Bare --create-experiment (no --add-questions at all) snapshots
        # ALL available questions from the configured dataset — the
        # documented system-default for --add-questions
        # (docs/reference/cli-commands.md: "System-Default: All
        # available"), pinned here so a change to that default is a
        # visible, deliberate event. dataset_small_valid.json has 10.
        - query: >-
            SELECT COUNT(*) FROM question_snapshots qs
            JOIN experiments e ON e.experiment_id = qs.experiment_id
            WHERE e.name = ?
          params: ["{ns}_ce001"]
          equals: 10
      unchanged_tables: [model_variants, runs, responses, errors]

  - id: CE-002
    name: criar experimento com nome duplicado deve falhar
    area: experiment
    profiles: [smoke, cli-unit, full]
    priority: high
    tags: [creation, negative]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    setup:
      - ["--create-experiment", "{ns}_ce002"]
    command:
      argv: ["--create-experiment", "{ns}_ce002"]
    expect:
      exit_code: 1
      no_traceback: true
    db:
      assertions:
        - query: "SELECT COUNT(*) FROM experiments WHERE name = ?"
          params: ["{ns}_ce002"]
          equals: 1  # still exactly one — the duplicate attempt created nothing

  - id: CE-003
    name: "--list-experiments funciona"
    area: experiment
    profiles: [smoke, cli-unit, full]
    priority: high
    tags: [listing]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    command:
      # Fixed 2026-08-17 (mode_matrix.py's Mode.INVALID gap) — see
      # docs/status/known-issues.md Resolved Issues. No stdout assertion
      # on content: this runs against the suite's shared database, so
      # whatever experiments other cases created by this point are listed;
      # asserting exact output here would be order-dependent and fragile.
      argv: ["--list-experiments"]
    expect:
      exit_code: 0
      no_traceback: true

  - id: CE-004
    name: "--help funciona"
    area: experiment
    profiles: [smoke, cli-unit, full]
    priority: normal
    tags: [help]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    command:
      # Fixed 2026-08-17 — see docs/status/known-issues.md Resolved Issues.
      argv: ["--help"]
    expect:
      exit_code: 0
      stdout_contains: ["usage:"]
      no_traceback: true

  - id: CE-005
    name: criar experimento com randomization seed inteira explicita
    area: experiment
    profiles: [cli-unit, full]
    priority: normal
    tags: [creation, randomization-seed]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    command:
      argv: ["--create-experiment", "{ns}_ce005", "--randomization-seed", "42"]
    expect:
      exit_code: 0
      no_traceback: true
    db:
      assertions:
        - query: "SELECT COUNT(*) FROM experiments WHERE name = ?"
          params: ["{ns}_ce005"]
          equals: 1

  - id: CE-006
    name: "randomization seed 0 deve ser preservada como valida (nao tratada como falsy)"
    area: experiment
    profiles: [cli-unit, contracts, full]
    priority: high
    tags: [creation, randomization-seed, contracts]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    command:
      argv: ["--create-experiment", "{ns}_ce006", "--randomization-seed", "0"]
    expect:
      exit_code: 0
      no_traceback: true
    db:
      assertions:
        - query: "SELECT json_extract(config_json, '$.RANDOMIZATION_SEED') FROM experiments WHERE name = ?"
          params: ["{ns}_ce006"]
          equals: 0

  - id: CE-007
    name: "--remove-experiment esta desabilitado deliberadamente"
    area: experiment
    profiles: [cli-unit, contracts, regression, full]
    priority: critical
    tags: [contracts, immutability, regression]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    setup:
      - ["--create-experiment", "{ns}_ce007"]
    command:
      # docs/status/known-issues.md: --remove-experiment does a real hard
      # cascading delete of question_snapshots/model_variants/runs, which
      # conflicts with docs/contracts/immutability.md ("cannot be
      # deleted") — disabled by user decision until further planning,
      # rather than shipping a contract-violating implementation.
      argv: ["--remove-experiment", "{ns}_ce007"]
    expect:
      exit_code: 1
      stderr_contains: ["disabled"]
      no_traceback: true
    db:
      assertions:
        - query: "SELECT COUNT(*) FROM experiments WHERE name = ?"
          params: ["{ns}_ce007"]
          equals: 1  # untouched — the disabled command must not delete anything
      unchanged_tables: [experiments, model_variants, question_snapshots, runs]

  - id: CE-008
    name: "deprecated 'null' literal exits 2 with a clean message, not a traceback (regressao)"
    area: experiment
    profiles: [cli-unit, regression, full]
    priority: normal
    tags: [negative, regression]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    command:
      # Fixed 2026-08-18: parse_args_normalized() -> normalize_nulls_explicit()
      # raises argparse.ArgumentError for the deprecated 'null' literal
      # (src/core/null_semantics.py) AFTER parser.parse_args() already
      # returned — outside argparse's own exception handling, so it used
      # to propagate as an uncaught traceback instead of a clean usage
      # error. Each of the 4 CLI modules that call parse_args_normalized
      # now catches ArgumentError at the main() call site and routes it
      # through parser.error() — argparse's own mechanism, exit code 2,
      # same as every other invalid-argument error. See
      # docs/status/known-issues.md. (parse_args_normalized itself still
      # raises ArgumentError for direct/unit callers — that part is
      # unchanged and intentional, see its docstring.)
      argv: ["--create-experiment", "{ns}_ce008", "--randomization-seed", "null"]
    expect:
      exit_code: 2
      stderr_contains: ["deprecated"]
      no_traceback: true
    db:
      assertions:
        - query: "SELECT COUNT(*) FROM experiments WHERE name = ?"
          params: ["{ns}_ce008"]
          equals: 0

  - id: CE-009
    name: "--provider-lock em experimento existente esta desabilitado deliberadamente"
    area: experiment
    profiles: [cli-unit, contracts, regression, full]
    priority: high
    tags: [contracts, immutability, regression]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    setup:
      - ["--create-experiment", "{ns}_ce009"]
    command:
      # User decision, 2026-08-18 (Fase 3, item 8): rewriting a frozen
      # experiment's config_json/config_hash post-creation — even for a
      # single field — contradicts docs/contracts/immutability.md.
      # Disabled rather than formalized as an exception. See
      # docs/status/known-issues.md.
      argv: ["--experiment", "{ns}_ce009", "--provider-lock", "true"]
    expect:
      exit_code: 1
      stderr_contains: ["disabled"]
      no_traceback: true
    db:
      assertions:
        - query: "SELECT json_extract(config_json, '$.PROVIDER_LOCK') FROM experiments WHERE name = ?"
          params: ["{ns}_ce009"]
          equals: 0  # unchanged from creation-time default (AUTO_PROVIDER_LOCK=false in env_valid_minimal) — config_json must not have been rewritten
      unchanged_tables: [experiments]

  - id: CE-010
    name: "--url system-default e FORBIDDEN, exit 2 (regressao, era exit 1 antes)"
    area: experiment
    profiles: [cli-unit, regression, full]
    priority: normal
    tags: [system-default, regression]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    command:
      # Before 2026-08-19: handle_create_experiment manually checked
      # `args.url is FORCE_SYSTEM_DEFAULT` and returned 1. Reclassified
      # FORBIDDEN per the approved 3-category system — now rejected at
      # parse time via normalize_special_config_values, exit 2. Intentional
      # behavior change, not a regression. See docs/status/known-issues.md.
      argv: ["--create-experiment", "{ns}_ce010", "--url", "system-default"]
    expect:
      exit_code: 2
      stderr_contains: ["system-default"]
      no_traceback: true
    db:
      assertions:
        - query: "SELECT COUNT(*) FROM experiments WHERE name = ?"
          params: ["{ns}_ce010"]
          equals: 0

  - id: CE-011
    name: "--create-experiment system-default e FORBIDDEN, exit 2 (regressao do bug 'blanket sweep')"
    area: experiment
    profiles: [cli-unit, regression, full]
    priority: normal
    tags: [system-default, regression]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    command:
      # Fixed 2026-08-19: before this fix, ANY optional argparse argument
      # with default=None/required=False (the old _is_nullable_arg
      # heuristic) was silently normalized, including --create-experiment
      # itself — 'system-default' as an experiment NAME silently became
      # the FORCE_SYSTEM_DEFAULT sentinel instead of a literal name. Now
      # explicitly classified FORBIDDEN. See docs/status/known-issues.md.
      argv: ["--create-experiment", "system-default"]
    expect:
      exit_code: 2
      stderr_contains: ["system-default"]
      no_traceback: true

  - id: CE-012
    name: "--model-seed no experimento e herdado por variante que nao especifica o proprio (Checkpoint B)"
    area: experiment
    profiles: [cli-unit, contracts, full]
    priority: high
    tags: [creation, model-seed, inheritance, contracts]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    setup:
      - ["--create-experiment", "{ns}_ce012", "--model-seed", "42"]
    command:
      argv: ["--experiment", "{ns}_ce012", "--add-model", "test/success"]
    expect:
      exit_code: 0
      no_traceback: true
    db:
      assertions:
        - query: "SELECT json_extract(config_json, '$.MODEL_SEED') FROM experiments WHERE name = ?"
          params: ["{ns}_ce012"]
          equals: 42
        - query: >-
            SELECT json_extract(mv.config, '$.MODEL_SEED')
            FROM model_variants mv
            JOIN experiments e ON e.experiment_id = mv.experiment_id
            WHERE e.name = ?
          params: ["{ns}_ce012"]
          equals: 42  # inherited from the experiment's own MODEL_SEED, --add-model didn't specify its own
