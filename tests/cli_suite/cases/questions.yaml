# Question command cases (area: questions). AQ- prefix per the manual roteiro.
cases:
  - id: AQ-001
    name: adicionar perguntas por intervalo numerico
    area: questions
    profiles: [smoke, cli-unit, full]
    priority: critical
    tags: [creation]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    # NOTE: bare --create-experiment (no --add-questions at all) snapshots
    # ALL available questions from the dataset — that's the documented
    # system-default for --add-questions (docs/reference/cli-commands.md:
    # "System-Default: All available"), not a bug. So this case exercises
    # the composite --create-experiment + --add-questions flow directly,
    # which is what actually controls the question set at creation time.
    command:
      argv: ["--create-experiment", "{ns}_aq001", "--add-questions", "1-3"]
    expect:
      exit_code: 0
      no_traceback: true
    db:
      assertions:
        - query: >-
            SELECT COUNT(*) FROM question_snapshots qs
            JOIN experiments e ON e.experiment_id = qs.experiment_id
            WHERE e.name = ?
          params: ["{ns}_aq001"]
          equals: 3
      unchanged_tables: [model_variants, runs, responses, errors]

  - id: AQ-002
    name: adicionar perguntas com filtro where sem resultado nao adiciona nada novo
    area: questions
    profiles: [cli-unit, full]
    priority: normal
    tags: [filters, negative]
    fixture:
      env: env_valid_minimal
      dataset: dataset_filters
    setup:
      # Explicit --add-questions "1" at creation time, to get a KNOWN
      # baseline count instead of the "all available" default — see the
      # note on AQ-001.
      - ["--create-experiment", "{ns}_aq002", "--add-questions", "1"]
    command:
      # --add-questions requires an explicit SPEC value (no bare/optional
      # form outside the --create-experiment composite flow — confirmed:
      # `--add-questions --where ...` is an argparse error, "expected one
      # argument"). "1-3" here is deliberately wider than the 1-question
      # baseline; --where narrows it down to zero NEW matches.
      argv: ["--experiment", "{ns}_aq002", "--add-questions", "1-3", "--where", "status=does_not_exist"]
    expect:
      exit_code: 0
      no_traceback: true
    db:
      assertions:
        # Still just the 1 baseline question — the where-filter matched
        # nothing new.
        - query: >-
            SELECT COUNT(*) FROM question_snapshots qs
            JOIN experiments e ON e.experiment_id = qs.experiment_id
            WHERE e.name = ?
          params: ["{ns}_aq002"]
          equals: 1

  - id: AQ-003
    name: "criacao de experimento e atomica quando add-questions falha"
    area: questions
    profiles: [cli-unit, contracts, regression, full]
    priority: critical
    tags: [contracts, atomicity, regression]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    command:
      # docs/.archive/pre-restructure/architecture/to-be/testes.md TESTE_CE_NULL1
      # described this scenario (still present as of 2026-08-17). Fixed
      # same day: bcllm.py's composite flow now propagates the failing
      # action's real exit code and rolls back (deletes) the experiment
      # it just created. See docs/status/known-issues.md Resolved Issues.
      #
      # Updated 2026-08-19 (same-action-same-path checkpoint): the
      # composite flow now runs --add-questions through the exact same
      # parse/normalize pipeline as standalone (run_add_questions), so
      # the deprecated 'null' literal is now rejected at the usage-error
      # layer (exit 2, argparse's own message) instead of reaching the
      # old domain-level "Invalid question specification" check (exit 1)
      # — the composite flow used to bypass normalization entirely, which
      # is exactly the bug this checkpoint fixed. This is not a new
      # semantic decision: standalone --experiment X --add-questions null
      # already behaved this way before this fix; composite now matches
      # it, per the "same adapter, same action" invariant.
      argv: ["--create-experiment", "{ns}_aq003", "--add-questions", "null"]
    expect:
      exit_code: 2
      stderr_contains: ["'null' literal is deprecated"]
      no_traceback: true
    db:
      assertions:
        - query: "SELECT COUNT(*) FROM experiments WHERE name = ?"
          params: ["{ns}_aq003"]
          equals: 0

  - id: AQ-004
    name: "rollback tambem desfaz uma acao anterior bem-sucedida (add-model) quando uma acao posterior falha"
    area: questions
    profiles: [cli-unit, contracts, regression, full]
    priority: critical
    tags: [contracts, atomicity, regression]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    command:
      # Exercises the harder rollback path: --add-model runs FIRST
      # (ADD_ACTION_FLAGS order) and succeeds, creating a model_variants
      # row; --add-questions runs SECOND and fails. Rollback must undo
      # BOTH the variant and the experiment, not just stop at the
      # experiment row — a single-action case like AQ-003 can't catch a
      # rollback that only cleans up the LAST action's own table.
      #
      # Updated 2026-08-19 (same-action-same-path checkpoint) — see AQ-003's
      # comment: exit code and message updated to match the now-consistent
      # standalone/composite --add-questions null rejection (usage error,
      # exit 2). The rollback assertion below (both the variant AND the
      # experiment must be gone) is the actual point of this case and is
      # unaffected by that change.
      argv: ["--create-experiment", "{ns}_aq004", "--add-model", "test/success", "--add-questions", "null"]
    expect:
      exit_code: 2
      stderr_contains: ["'null' literal is deprecated"]
      no_traceback: true
    db:
      assertions:
        - query: "SELECT COUNT(*) FROM experiments WHERE name = ?"
          params: ["{ns}_aq004"]
          equals: 0
        # Orphan check, not scoped by name (other cases in this shared
        # suite database also create test/success variants): any
        # model_variants row whose experiment no longer exists means the
        # rollback deleted the experiment but left the variant behind.
        - query: >-
            SELECT COUNT(*) FROM model_variants
            WHERE experiment_id NOT IN (SELECT experiment_id FROM experiments)
          params: []
          equals: 0

  - id: AQ-005
    name: "--list-questions lista os snapshots do experimento"
    area: questions
    profiles: [cli-unit, full]
    priority: normal
    tags: [listing]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    setup:
      - ["--create-experiment", "{ns}_aq005", "--add-questions", "1"]
    command:
      argv: ["--experiment", "{ns}_aq005", "--list-questions"]
    expect:
      exit_code: 0
      stdout_contains: ["Questions in experiment:"]
      no_traceback: true

  - id: AQ-006
    name: "--remove-question em id inexistente falha sem tocar o banco"
    area: questions
    profiles: [cli-unit, full]
    priority: normal
    tags: [negative]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    setup:
      - ["--create-experiment", "{ns}_aq006"]
    command:
      argv: ["--experiment", "{ns}_aq006", "--remove-question", "snap_doesnotexist"]
    expect:
      exit_code: 1
      stderr_contains: ["not found"]
      no_traceback: true
    db:
      unchanged_tables: [question_snapshots]

  - id: AQ-007
    name: "--add-questions system-default no fluxo standalone seleciona todas as perguntas (regressao item 1)"
    area: questions
    profiles: [cli-unit, regression, full]
    priority: high
    tags: [system-default, regression]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    setup:
      - ["--create-experiment", "{ns}_aq007", "--add-questions", "1"]
    command:
      # Fixed 2026-08-19 (Fase 4 marco 4A): handle_add_questions had no
      # branch for FORCE_SYSTEM_DEFAULT at all — see docs/status/known-issues.md.
      argv: ["--experiment", "{ns}_aq007", "--add-questions", "system-default"]
    expect:
      exit_code: 0
      no_traceback: true
    db:
      assertions:
        # 1 baseline (from setup) + 9 more from dataset_small_valid = 10 total.
        - query: >-
            SELECT COUNT(*) FROM question_snapshots qs
            JOIN experiments e ON e.experiment_id = qs.experiment_id
            WHERE e.name = ?
          params: ["{ns}_aq007"]
          equals: 10

  - id: AQ-008
    name: "--where system-default combinado com filtro concreto e rejeitado, exit 2, nada gravado"
    area: questions
    profiles: [cli-unit, regression, full]
    priority: high
    tags: [system-default, regression, negative]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    setup:
      - ["--create-experiment", "{ns}_aq008"]
    command:
      # system-default must appear alone — combined with a concrete filter
      # is a contradiction (apply no filter vs. apply this filter), exit 2,
      # rejected before any DB write. See docs/status/known-issues.md and
      # docs/contracts/system-default-semantics.md.
      argv: ["--experiment", "{ns}_aq008", "--add-questions", "1-3", "--where", "system-default", "--where", "status=valid"]
    expect:
      exit_code: 2
      stderr_contains: ["system-default"]
      no_traceback: true
    db:
      unchanged_tables: [question_snapshots]

  - id: AQ-009
    name: "--source-file system-default e FORBIDDEN, exit 2 (regressao)"
    area: questions
    profiles: [cli-unit, regression, full]
    priority: normal
    tags: [system-default, regression, negative]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    setup:
      - ["--create-experiment", "{ns}_aq009"]
    command:
      # --source-file is structural (a file path that must be provided
      # explicitly), same reasoning as --url. Classified FORBIDDEN.
      argv: ["--experiment", "{ns}_aq009", "--add-questions", "1", "--source-file", "system-default"]
    expect:
      exit_code: 2
      stderr_contains: ["system-default"]
      no_traceback: true
    db:
      unchanged_tables: [question_snapshots]

  - id: AQ-010
    name: "--where system-default no fluxo composto ignora QUESTIONS_STATUS_ADD/EXCLUDE do .env (bootstrap)"
    area: questions
    profiles: [cli-unit, regression, full]
    priority: high
    tags: [system-default, regression]
    fixture:
      env: env_questions_status_filters
      dataset: dataset_filters
    command:
      # dataset_filters has 9 questions: 7 status=valid, 2 status=annulled.
      # env_questions_status_filters sets QUESTIONS_STATUS_ADD=status=valid
      # and QUESTIONS_STATUS_EXCLUDE=status=annulled — if either .env
      # fallback were consulted (bug), only the 7 valid ones would land.
      # --where system-default must explicitly bypass QUESTIONS_STATUS_ADD;
      # --exclude system-default must explicitly bypass QUESTIONS_STATUS_EXCLUDE.
      # All 9 questions must be added. See docs/status/known-issues.md.
      argv: ["--create-experiment", "{ns}_aq010", "--where", "system-default", "--exclude", "system-default"]
    expect:
      exit_code: 0
      no_traceback: true
    db:
      assertions:
        - query: >-
            SELECT COUNT(*) FROM question_snapshots qs
            JOIN experiments e ON e.experiment_id = qs.experiment_id
            WHERE e.name = ?
          params: ["{ns}_aq010"]
          equals: 9

  - id: AQ-011
    name: "--experiment system-default e FORBIDDEN, exit 2 (identity selector, nunca normalizado)"
    area: questions
    profiles: [cli-unit, contracts, regression, full]
    priority: normal
    tags: [system-default, contracts, regression]
    fixture:
      env: env_valid_minimal
      dataset: dataset_small_valid
    command:
      # Black-box replacement for tests/unit/cli/test_experiment_flag_forbidden_consistency.py
      # (marco 4A pre-conversion Fase 0, 2026-08-20) — bcllm_questions.py's own
      # SYSTEM_DEFAULT_FORBIDDEN set. See docs/status/known-issues.md.
      argv: ["--experiment", "system-default", "--list-questions"]
    expect:
      exit_code: 2
      stderr_contains: ["system-default"]
      no_traceback: true
